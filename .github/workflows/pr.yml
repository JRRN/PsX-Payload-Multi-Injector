name: PR

env: 
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Linux Qt deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libegl1
      - run: pip install uv
      - run: uv pip install --system -r requirements-test.txt
      - run: python -m pytest tests -v

  build:
    needs: test
    strategy:
      max-parallel: 1
      matrix:  
        include:
          - os: windows-latest
            artifact_suffix: windows
            windowed: ""
          - os: macos-latest
            artifact_suffix: macos-arm64
            windowed: "--windowed"
          - os: macos-13
            artifact_suffix: macos-x86_64
            windowed: "--windowed"
          - os: ubuntu-latest
            artifact_suffix: linux
            windowed: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Linux Qt deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libegl1

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Get version
        id: get_version
        shell: bash
        run: |
          VERSION=$(python -c "from src.models.version import __version__; print(__version__)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Free up disk space
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            # Clean package managers
            sudo apt-get clean
            sudo apt-get autoclean
            sudo apt-get autoremove -y
            
            # Remove unnecessary packages
            sudo apt-get remove -y --purge \
              build-essential \
              ghc-* \
              google-chrome-* \
              firefox \
              dotnet-* \
              powershell \
              mysql-* \
              postgresql-* \
              snap 2>/dev/null || true
            
            # Clean caches
            sudo apt-get clean
            
            # Remove Docker images and cache
            docker rmi $(docker image ls -aq) 2>/dev/null || true
            docker system prune -af 2>/dev/null || true
            
            # Remove unused system directories
            rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
            rm -rf /tmp/* /var/tmp/* 2>/dev/null || true
          fi
          
          # Clean Python and uv caches (all platforms)
          pip cache purge 2>/dev/null || true
          uv cache prune 2>/dev/null || true

      - name: Build executable (one-folder)
        shell: bash
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            SEP=";"
          else
            SEP=":"
          fi
          ICON_ARG=""
          if [[ "$RUNNER_OS" == "macOS" ]] && [[ -f src/assets/logo.icns ]]; then
            ICON_ARG="--icon src/assets/logo.icns"
          elif [[ -f src/assets/logo.ico ]]; then
            ICON_ARG="--icon src/assets/logo.ico"
          fi
          python -m PyInstaller --clean --noconfirm ${{ matrix.windowed }} \
            src/main.py \
            --name "PS_MultiInjector-$VERSION" \
            --paths src \
            --add-data "src/assets/logo.png${SEP}assets" \
            --add-data "src/lang${SEP}lang" \
            --add-data "src/assets/logo.ico${SEP}assets" \
            $ICON_ARG

      - name: Clean up build directories
        shell: bash
        run: |
          rm -rf dist/ build/ .PyInstaller/ __pycache__ src/__pycache__ src/*/__pycache__ tests/__pycache__ .pytest_cache/
