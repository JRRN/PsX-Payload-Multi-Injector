name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_STEP_DEBUG: false
  RUNNER_DEBUG: false

on:
  push:
    branches: [main]
    paths-ignore:
      - src/models/version.py
      - docs/CHANGELOG.md

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install Linux Qt deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libegl1
      - run: pip install uv
      - run: uv pip install --system -r requirements-test.txt
      - run: python -m pytest tests -v

  version-bump:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Bump version
        id: bump
        run: |
          python build_local/bump_version.py
          VERSION=$(python -c "from src.models.version import __version__; print(__version__)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Check for changes
        id: check
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
      - name: Commit version bump
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/models/version.py docs/CHANGELOG.md
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }}"
      - name: Push changes
        if: steps.check.outputs.has_changes == 'true'
        run: git push origin main

  build:
    needs: version-bump
    strategy:
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            artifact_suffix: windows
            windowed: ""
          - os: macos-latest
            artifact_suffix: macos-arm64
            windowed: "--windowed"
          - os: macos-15-intel
            artifact_suffix: macos-x86_64
            windowed: "--windowed"
          - os: ubuntu-latest
            artifact_suffix: linux
            windowed: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Linux Qt deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libegl1

      - name: Free up disk space
        shell: bash
        run: |
          echo "Cleaning disk on $RUNNER_OS..."

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "Freeing macOS disk space..."
            sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/*
            sudo rm -rf /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/DeviceSupport/*
            sudo rm -rf ~/Library/Developer/Xcode/DerivedData/*
            sudo rm -rf ~/Library/Caches/*
            brew cleanup -s || true
            rm -rf "$(brew --cache)" || true
            sudo rm -rf /usr/local/share/dotnet
            sudo rm -rf ~/Library/Android || true
          fi

          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get clean
            sudo apt-get autoclean
            sudo apt-get autoremove -y
            sudo apt-get remove -y --purge \
              build-essential \
              ghc-* \
              google-chrome-* \
              firefox \
              dotnet-* \
              powershell \
              mysql-* \
              postgresql-* \
              snap 2>/dev/null || true
            docker rmi $(docker image ls -aq) 2>/dev/null || true
            docker system prune -af 2>/dev/null || true
            rm -rf /usr/share/dotnet
          fi

          pip cache purge || true
          uv cache prune || true
          rm -rf ~/.cache/pip ~/.cache/uv || true

          df -h

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Get version
        id: get_version
        shell: bash
        run: |
          VERSION=$(python -c "from src.models.version import __version__; print(__version__)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build executable (one-folder)
        shell: bash
        run: |
          VERSION=${{ steps.get_version.outputs.version }}

          export TMPDIR="$HOME/tmp"
          mkdir -p "$TMPDIR"

          if [[ "$RUNNER_OS" == "Windows" ]]; then SEP=";"; else SEP=":"; fi

          ICON_ARG=""
          if [[ "$RUNNER_OS" == "macOS" ]] && [[ -f src/assets/logo.icns ]]; then
            ICON_ARG="--icon src/assets/logo.icns"
          elif [[ -f src/assets/logo.ico ]]; then
            ICON_ARG="--icon src/assets/logo.ico"
          fi

          python -m PyInstaller --clean --noconfirm --strip ${{ matrix.windowed }} \
            src/main.py \
            --name "PS_MultiInjector-$VERSION" \
            --paths src \
            --add-data "src/assets/logo.png${SEP}assets" \
            --add-data "src/lang${SEP}lang" \
            --add-data "src/assets/logo.ico${SEP}assets" \
            $ICON_ARG

      - name: Prepare artifact directory
        shell: bash
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          ARTIFACT_DIR="PS_MultiInjector-$VERSION-${{ matrix.artifact_suffix }}"
          
          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"
          cp -r dist/PS_MultiInjector-$VERSION/* "$ARTIFACT_DIR"/ 2>/dev/null || echo "No dist directory found"

      - name: Prepare source code
        shell: bash
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          SRC_DIR="PS_MultiInjector-$VERSION-source"
          
          rm -rf "$SRC_DIR"
          mkdir -p "$SRC_DIR"
          
          # Copy everything except excluded directories
          find . -maxdepth 1 -type f \( -name "*.md" -o -name "*.txt" -o -name "*.yml" -o -name "*.yaml" -o -name "*.json" -o -name "*.sh" -o -name "*.py" -o -name "*.ini" \) -exec cp {} "$SRC_DIR/" \;
          
          # Copy directories (excluding unwanted ones)
          for dir in src payloads build_local ci-cd docs; do
            [[ -d "$dir" ]] && cp -r "$dir" "$SRC_DIR/"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: PS_MultiInjector-${{ steps.get_version.outputs.version }}-${{ matrix.artifact_suffix }}
          path: PS_MultiInjector-${{ steps.get_version.outputs.version }}-${{ matrix.artifact_suffix }}/

      - name: Upload source code
        uses: actions/upload-artifact@v5
        with:
          name: PS_MultiInjector-${{ steps.get_version.outputs.version }}-source
          path: PS_MultiInjector-${{ steps.get_version.outputs.version }}-source/

  release:
    needs: [build, version-bump]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts/

      - name: List downloaded artifacts
        shell: bash
        run: find artifacts/ -type f | head -20

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version-bump.outputs.version }}
          name: PS MultiInjector v${{ needs.version-bump.outputs.version }}
          files: artifacts/**/*
          generate_release_notes: true
          make_latest: true
