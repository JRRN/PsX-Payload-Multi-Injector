name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_STEP_DEBUG: false
  RUNNER_DEBUG: false

on:
  push:
    branches: [main]
    paths-ignore:
      - src/models/version.py
      - docs/CHANGELOG.md

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install Linux Qt deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libegl1
      - run: pip install uv
      - run: uv pip install --system -r requirements-test.txt
      - run: python -m pytest tests -v

  version-bump:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Bump version
        id: bump
        run: |
          python build_local/bump_version.py
          VERSION=$(python -c "from src.models.version import __version__; print(__version__)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Check for changes
        id: check
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
      - name: Commit version bump
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/models/version.py docs/CHANGELOG.md
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }}"
      - name: Push changes
        if: steps.check.outputs.has_changes == 'true'
        run: git push origin main

  build:
    needs: version-bump
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_suffix: windows
            windowed: ""
          - os: macos-latest
            artifact_suffix: macos-arm64
            windowed: "--windowed"
          - os: macos-15-intel
            artifact_suffix: macos-x86_64
            windowed: "--windowed"
          - os: ubuntu-latest
            artifact_suffix: linux
            windowed: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Linux Qt deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libegl1

      - name: Free up disk space
        shell: bash
        run: |
          echo "Cleaning disk on $RUNNER_OS..."

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "Freeing macOS disk space..."
            sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/*
            sudo rm -rf /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/DeviceSupport/*
            sudo rm -rf ~/Library/Developer/Xcode/DerivedData/*
            sudo rm -rf ~/Library/Caches/*
            brew cleanup -s || true
            rm -rf "$(brew --cache)" || true
            sudo rm -rf /usr/local/share/dotnet
            sudo rm -rf ~/Library/Android || true
          fi

          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get clean
            sudo apt-get autoclean
            sudo apt-get autoremove -y
            sudo apt-get remove -y --purge \
              build-essential \
              ghc-* \
              google-chrome-* \
              firefox \
              dotnet-* \
              powershell \
              mysql-* \
              postgresql-* \
              snap 2>/dev/null || true
            docker rmi $(docker image ls -aq) 2>/dev/null || true
            docker system prune -af 2>/dev/null || true
            rm -rf /usr/share/dotnet
          fi

          pip cache purge || true
          uv cache prune || true
          rm -rf ~/.cache/pip ~/.cache/uv || true

          df -h

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Get version
        id: get_version
        shell: bash
        run: |
          VERSION=$(python -c "from src.models.version import __version__; print(__version__)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build executable (one-folder)
        shell: bash
        run: |
          VERSION=${{ steps.get_version.outputs.version }}

          export TMPDIR="$HOME/tmp"
          mkdir -p "$TMPDIR"

          if [[ "$RUNNER_OS" == "Windows" ]]; then SEP=";"; else SEP=":"; fi

          ICON_ARG=""
          if [[ "$RUNNER_OS" == "macOS" ]] && [[ -f src/assets/logo.icns ]]; then
            ICON_ARG="--icon src/assets/logo.icns"
          elif [[ -f src/assets/logo.ico ]]; then
            ICON_ARG="--icon src/assets/logo.ico"
          fi

          python -m PyInstaller --clean --noconfirm --strip ${{ matrix.windowed }} \
            src/main.py \
            --name "PS_MultiInjector-$VERSION" \
            --paths src \
            --add-data "src/assets/logo.png${SEP}assets" \
            --add-data "src/lang${SEP}lang" \
            --add-data "src/assets/logo.ico${SEP}assets" \
            $ICON_ARG

      - name: Package artifact
        shell: bash
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          OUTDIR="PS_MultiInjector-$VERSION-${{ matrix.artifact_suffix }}"

          rm -rf "$OUTDIR" "$OUTDIR.zip" "$OUTDIR.tar.gz" "$OUTDIR.zip.sha256" "$OUTDIR.tar.gz.sha256"
          mkdir -p "$OUTDIR"
          cp -r dist/PS_MultiInjector-$VERSION/* "$OUTDIR"/

          if [[ "$RUNNER_OS" == "Linux" ]]; then
            tar -czf "$OUTDIR.tar.gz" "$OUTDIR"
            sha256sum "$OUTDIR.tar.gz" > "$OUTDIR.tar.gz.sha256"
            echo "$(sha256sum "$OUTDIR.tar.gz")" >> checksums.txt
          else
            python <<'EOF'
              import hashlib, pathlib, zipfile, os

              outdir = pathlib.Path("PS_MultiInjector-${{ steps.get_version.outputs.version }}-${{ matrix.artifact_suffix }}")
              zip_path = outdir.with_suffix('.zip')

              with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as zf:
                  for p in outdir.rglob('*'):
                      zf.write(p, p.as_posix())

              digest = hashlib.sha256(zip_path.read_bytes()).hexdigest()
              line = f"{digest}  {zip_path.name}\n"

              pathlib.Path(f"{zip_path}.sha256").write_text(line)
              pathlib.Path("checksums.txt").write_text(line)
              EOF
          fi

      - name: Clean up build directories
        shell: bash
        run: |
          rm -rf dist/ build/ .PyInstaller/ __pycache__ src/**/__pycache__ tests/__pycache__ .pytest_cache/

      - name: Package source code
        shell: bash
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          SRC_ZIP="PS_MultiInjector-$VERSION-source.zip"

          rm -f "$SRC_ZIP" "$SRC_ZIP.sha256"

          if [[ "$RUNNER_OS" == "Linux" ]]; then
            zip -r "$SRC_ZIP" . \
              -x "*.git*" "dist/*" "build/*" "__pycache__/*" "*.pyc" "*.pyo" "*.pytest_cache/*" \
              ".build_local/*" ".venv/*" "artifacts/*" "release_files/*"
            sha256sum "$SRC_ZIP" > "$SRC_ZIP.sha256"
            echo "$(sha256sum "$SRC_ZIP")" >> checksums.txt
          else
            python <<'EOF'
              import hashlib, fnmatch, pathlib, zipfile, os

              zip_path = pathlib.Path("PS_MultiInjector-${{ steps.get_version.outputs.version }}-source.zip")
              excludes = ['*.git*','dist/*','build/*','__pycache__/*','*.pyc','*.pyo','*.pytest_cache/*','.build_local/*','.venv/*','artifacts/*','release_files/*']

              with zipfile.ZipFile(zip_path,'w',zipfile.ZIP_DEFLATED) as zf:
                  for p in pathlib.Path('.').rglob('*'):
                      rel = p.as_posix()
                      if not any(fnmatch.fnmatch(rel,pat) for pat in excludes):
                          zf.write(p, rel)

              digest = hashlib.sha256(zip_path.read_bytes()).hexdigest()
              line = f"{digest}  {zip_path.name}\n"

              pathlib.Path(f"{zip_path}.sha256").write_text(line)
              pathlib.Path("checksums.txt").write_text(line)
              EOF
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: PS_MultiInjector-${{ steps.get_version.outputs.version }}-${{ matrix.artifact_suffix }}
          path: |
            *.zip
            *.tar.gz
            *.sha256
            checksums.txt

  release:
    needs: [build, version-bump]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all packaged artifacts
        uses: actions/download-artifact@v5
        with:
          path: release_files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version-bump.outputs.version }}
          name: PS MultiInjector v${{ needs.version-bump.outputs.version }}
          files: |
            release_files/**/*.{zip,tar.gz}
            release_files/**/*.{sha256}
            release_files/**/checksums.txt
          generate_release_notes: true
          make_latest: true
